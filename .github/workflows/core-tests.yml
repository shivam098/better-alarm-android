name: Core tests

# Only the core module is built here. It is a standalone Gradle build with no
# Android plugin, so this needs a JDK and nothing else -- no SDK download, no
# licence acceptance, no emulator. The app module cannot be built without the
# Android SDK and is deliberately not attempted.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run core tests
        working-directory: core
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-report
          path: core/build/reports/tests/test